<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #111827);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: white;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    }

    h2 {
      margin: 0 0 10px;
      color: #0f172a;
    }

    p {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .error {
      background: #fff1f2;
      color: #be123c;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    input {
      width: 100%;
      height: 48px;
      margin-bottom: 14px;
      padding: 0 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .link {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
    }

    .link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Create Account</h2>
    <p>Sign up to access your anemia detection dashboard.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/signup">
      <input type="text" name="full_name" placeholder="Full Name" required />
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <input type="password" name="confirm_password" placeholder="Confirm Password" required />
      <button type="submit">Sign Up</button>
    </form>

    <div class="link">
      Already have an account? <a href="/login">Login</a>
    </div>
  </div>
</body>
</html>
